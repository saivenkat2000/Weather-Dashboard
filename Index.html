
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/506c8bff58.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="search-box">
                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter your location"
                    class="input-box">

                <button id="searchBtn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>

        <div class="location-not-found" style="display:none;">
            <h1>Sorry, Location not found!</h1>
            <img src="assets/locnot.jpg" alt="Location Not Found">
        </div>

        <div class="weather-body" style="display:none;">
            <img src="" alt="Weather Image" id="weather-img">

            <div class="weather-box">
                <p class="temparature">0°C</p>
                <p class="description">Light Rain</p>
            </div>

            <div class="weather-details">

                <div class="humidity">
                    <i class="fa-solid fa-droplet"></i>

                    <div class="text">
                        <span id="humidity">45%</span>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="wind">
                    <i class="fa-solid fa-wind"></i>

                    <div class="text">
                        <span id="wind-speed">12 km/h</span>
                        <p>Wind Speed</p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
